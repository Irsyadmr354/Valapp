name: Build & Release Valapp Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze

      - name: Configure Production Keystore (if secret provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            echo "storePassword=$STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
            echo "Production keystore configured successfully."
          else
            echo "No production keystore secret found. Gradle will use fallback signing."
          fi

      - name: Build Universal Release APK
        run: |
          mkdir -p symbols
          flutter build apk --release --obfuscate --split-debug-info=symbols

      - name: Build Split-per-ABI Release APKs
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=symbols

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=symbols

      - name: Organize Release Artifacts
        run: |
          mkdir -p build_output
          cp build/app/outputs/flutter-apk/app-release.apk build_output/Valapp-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build_output/Valapp-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build_output/Valapp-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build_output/Valapp-x86_64.apk || true
          cp build/app/outputs/bundle/release/app-release.aab build_output/Valapp-release.aab || true

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build_output/*.apk
            build_output/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
