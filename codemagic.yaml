workflows:
  ios-release:
    name: iOS Release IPA (unsigned)
    max_build_duration: 60
    environment:
      flutter: 3.44.8
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Build iOS RELEASE (no code signing)
        script: |
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=FLUTTER_BUILD_MODE=release

      - name: Package as IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "build/ios/iphoneos/Runner.app" "$CM_BUILD_DIR/Payload/Runner.app"
          cd "$CM_BUILD_DIR"
          zip -r "ValApp_release.ipa" "Payload"
          echo "IPA created: $CM_BUILD_DIR/ValApp_release.ipa"

    artifacts:
      - "$CM_BUILD_DIR/ValApp_release.ipa"

  android-release:
    name: Android Release APK
    max_build_duration: 30
    environment:
      flutter: 3.44.8
      java: '17'

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android APK release
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
