workflows:
  ios-release:
    name: iOS Release IPA (unsigned)
    max_build_duration: 60
    environment:
      flutter: 3.44.8
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Generate Flutter engine files
        script: |
          # Generate necessary Flutter files without triggering full Xcode build
          flutter build ios --simulator --no-codesign
          # The above builds for simulator (no signing needed at all)
          # We'll then build for device using raw xcodebuild

      - name: Build release for device with xcodebuild
        script: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/Runner.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | xcpretty --color

      - name: Package as IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          APP=$(find "$CM_BUILD_DIR/Runner.xcarchive/Products/Applications" -name "*.app" | head -1)
          cp -r "$APP" "$CM_BUILD_DIR/Payload/Runner.app"
          cd "$CM_BUILD_DIR"
          zip -r ValApp.ipa Payload
          echo "IPA: $(du -sh ValApp.ipa)"

    artifacts:
      - "$CM_BUILD_DIR/ValApp.ipa"

  android-release:
    name: Android Release APK
    max_build_duration: 30
    environment:
      flutter: 3.44.8
      java: '17'

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android APK release
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
