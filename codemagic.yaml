workflows:
  ios-release:
    name: iOS Release IPA (unsigned)
    max_build_duration: 60
    environment:
      flutter: 3.44.8
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Build Flutter iOS release framework
        script: |
          flutter build ios \
            --release \
            --no-codesign

      - name: Archive with xcodebuild (no signing)
        script: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/Runner.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            | xcpretty

      - name: Package as IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r \
            "$CM_BUILD_DIR/Runner.xcarchive/Products/Applications/Runner.app" \
            "$CM_BUILD_DIR/Payload/Runner.app"
          cd "$CM_BUILD_DIR"
          zip -r "ValApp.ipa" "Payload"
          ls -lh ValApp.ipa

    artifacts:
      - "$CM_BUILD_DIR/ValApp.ipa"

  android-release:
    name: Android Release APK
    max_build_duration: 30
    environment:
      flutter: 3.44.8
      java: '17'

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android APK release
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
