workflows:
  ios-release:
    name: iOS Release IPA (unsigned)
    max_build_duration: 60
    environment:
      flutter: 3.44.8
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Build Flutter iOS frameworks only (no Xcode signing)
        script: |
          flutter build ios \
            --release \
            --no-codesign \
            --no-tree-shake-icons

      - name: Archive with xcodebuild (signing completely disabled)
        script: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/Runner.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            EXPANDED_CODE_SIGN_IDENTITY="-" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARIES_FOR_DISTRIBUTION=YES \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: Export unsigned IPA from archive
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          APP_PATH=$(find "$CM_BUILD_DIR/Runner.xcarchive" -name "*.app" | head -1)
          cp -r "$APP_PATH" "$CM_BUILD_DIR/Payload/Runner.app"
          cd "$CM_BUILD_DIR"
          zip -r "ValApp.ipa" "Payload"
          echo "✅ IPA size: $(du -sh ValApp.ipa | cut -f1)"

    artifacts:
      - "$CM_BUILD_DIR/ValApp.ipa"

  android-release:
    name: Android Release APK
    max_build_duration: 30
    environment:
      flutter: 3.44.8
      java: '17'

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android APK release
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
